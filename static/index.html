<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* Intelligence Platform palette (ds-tokens + paid_marketing): dark navy first, light on request */
:root {
  --bg:#050714; --panel:rgba(12,15,28,.72); --panel2:rgba(255,255,255,.028); --soft:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#e8ecf8; --ink2:#c4cbe4; --muted:#8b94be; --faint:#5d6688;
  --accent:#7c83f5; --accent2:#9b87fd;
  --scale:#2dd4aa; --keep:#7c83f5; --cut:#fb7185; --early:#f5a623; --avg:#b78bfa;
  --shadow:0 24px 60px -30px rgba(0,0,0,.8);
  --glow:radial-gradient(900px 420px at 12% -10%, rgba(124,131,245,.16), transparent 60%),
         radial-gradient(700px 380px at 95% 0%, rgba(45,212,170,.10), transparent 60%);
}
:root[data-theme="light"] {
  --bg:#eef1f8; --panel:rgba(255,255,255,.86); --panel2:rgba(18,26,54,.025); --soft:rgba(18,26,54,.04);
  --line:rgba(18,26,54,.10); --line2:rgba(18,26,54,.17);
  --ink:#17213a; --ink2:#2c3756; --muted:#4d5680; --faint:#7c86a8;
  --accent:#5b62e0; --accent2:#7c5ce0;
  --scale:#0f7a52; --keep:#5b62e0; --cut:#d4304f; --early:#b45309; --avg:#6d4fc4;
  --shadow:0 20px 50px -30px rgba(30,40,80,.35);
  --glow:radial-gradient(900px 420px at 12% -10%, rgba(124,131,245,.14), transparent 60%);
}
* { box-sizing:border-box; }
html { background:var(--bg); }
body { margin:0; min-height:100vh; background:var(--glow), var(--bg); background-attachment:fixed; color:var(--ink);
  font:14px/1.5 'Space Grotesk',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
select option { color:#000; background:#fff; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
.wrap { max-width:1500px; margin:0 auto; padding:0 32px; }
header { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; justify-content:space-between; padding:30px 0 22px; }
.eyebrow { display:inline-flex; align-items:center; gap:9px; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--scale); padding:6px 12px 6px 10px; border-radius:80px; background:color-mix(in srgb,var(--scale) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--scale) 26%,transparent); }
.eyebrow .d { width:7px; height:7px; border-radius:50%; background:var(--scale); animation:pulse 2.4s infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 color-mix(in srgb,var(--scale) 40%,transparent); } 50% { box-shadow:0 0 0 6px transparent; } }
@media (prefers-reduced-motion:reduce) { .eyebrow .d { animation:none; } }
h1 { font-family:'Bricolage Grotesque','Space Grotesk',sans-serif; font-size:clamp(30px,4vw,46px); font-weight:700; letter-spacing:-.025em; line-height:1.04; margin:14px 0 8px; }
.grad { background:linear-gradient(110deg,var(--accent) 10%,var(--scale) 90%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; padding-right:.06em; }
.meta { color:var(--muted); font-size:13px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
main { padding-bottom:48px; }
.banner { padding:11px 16px; border-radius:12px; font-size:13px; margin-bottom:12px; border:1px solid; }
.banner.demo { background:color-mix(in srgb,var(--early) 10%,transparent); color:var(--early); border-color:color-mix(in srgb,var(--early) 30%,transparent); }
.banner.err { background:color-mix(in srgb,var(--cut) 10%,transparent); color:var(--cut); border-color:color-mix(in srgb,var(--cut) 30%,transparent); }
.bar { min-width:0; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; padding:12px 16px; margin-bottom:12px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.bar label { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:13px; }
select, input[type=date], input[type=number], input[type=search] { font:inherit; font-size:13px; color:var(--ink); background:var(--soft);
  border:1px solid var(--line2); border-radius:9px; padding:6px 10px; outline:none; }
select:focus, input:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent); }
input[type=number] { width:72px; }
:root { color-scheme:dark; } :root[data-theme="light"] { color-scheme:light; }
input[type=date] { cursor:pointer; caret-color:transparent; min-width:150px; }
input[type=date]::-webkit-calendar-picker-indicator { cursor:pointer; opacity:.85; }
:root:not([data-theme="light"]) input[type=date]::-webkit-calendar-picker-indicator { filter:invert(.8); }
#customDates { display:inline-flex; gap:8px; align-items:center; color:var(--muted); }
button { font:inherit; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--line2); background:var(--soft); color:var(--ink);
  border-radius:10px; padding:8px 14px; transition:border-color .15s, background .15s, transform .15s; }
button:hover { border-color:var(--accent); }
button.primary { background:linear-gradient(110deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; }
button.primary:hover { transform:translateY(-1px); }
button:disabled { opacity:.6; cursor:wait; }
.badge { font-size:12px; color:var(--scale); display:inline-flex; gap:7px; align-items:center; }
.badge::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--scale); }
.rules { font-size:13px; color:var(--muted); }
.rules b { color:var(--ink); }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:16px 0; }
.kpi { position:relative; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px 13px;
  box-shadow:var(--shadow); --k:var(--faint); min-width:0; }
.kpi::before { content:""; position:absolute; inset:0 0 auto; height:2px; background:linear-gradient(90deg,var(--k),transparent); }
.kpi .l { overflow-wrap:anywhere; color:var(--muted); font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.kpi .v { font-family:'Bricolage Grotesque','Space Grotesk',sans-serif; font-size:clamp(22px,2.1vw,28px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:4px 0 2px; }
.kpi .s { color:var(--muted); font-size:12px; }
.kpi.avg { --k:var(--avg); border-color:color-mix(in srgb,var(--avg) 40%,transparent); } .kpi.avg .v { color:var(--avg); }
.kpi.scale { --k:var(--scale); } .kpi.scale .v { color:var(--scale); }
.kpi.keep { --k:var(--keep); } .kpi.keep .v { color:var(--keep); }
.kpi.cut { --k:var(--cut); } .kpi.cut .v { color:var(--cut); }
.kpi.early { --k:var(--early); } .kpi.early .v { color:var(--early); }
.tabs { display:inline-flex; gap:4px; margin:4px 0 16px; padding:4px; background:var(--panel); border:1px solid var(--line); border-radius:14px; flex-wrap:wrap; }
.tabs button { border:none; background:none; padding:8px 16px; color:var(--muted); border-radius:10px; }
.tabs button.on { color:#fff; background:linear-gradient(110deg,var(--accent),var(--accent2)); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:20px 22px; margin-bottom:18px; box-shadow:var(--shadow);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
.card h2 { font-family:'Bricolage Grotesque','Space Grotesk',sans-serif; font-size:18px; font-weight:650; letter-spacing:-.01em; margin:0 0 4px; }
.card p.sub { margin:0 0 14px; color:var(--muted); font-size:13px; }
.card p.sub b { color:var(--ink2); }
code { font-size:.92em; background:var(--soft); padding:1px 5px; border-radius:5px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
.chip { border-radius:80px; padding:5px 13px; font-size:12.5px; }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tablewrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:var(--faint); font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:8px 10px;
  border-bottom:1px solid var(--line2); white-space:nowrap; cursor:pointer; user-select:none; }
th:hover { color:var(--muted); }
th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
th.sorted { color:var(--accent); } th.sorted::after { content:" ▾"; } th.sorted.asc::after { content:" ▴"; }
td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:hover td { background:var(--panel2); }
.thumb { width:54px; height:54px; border-radius:10px; object-fit:cover; background:var(--soft); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:10px; color:var(--muted); text-align:center; }
.name { font-weight:600; max-width:340px; word-break:break-word; }
.small { color:var(--muted); font-size:12px; }
.hook { max-width:360px; font-family:'Instrument Serif',serif; font-style:italic; font-size:15px; color:var(--ink2); }
.small.hook { font-size:14px; }
.pill { display:inline-block; border-radius:80px; padding:3px 10px; font-size:11.5px; font-weight:700; white-space:nowrap; border:1px solid; }
.v-Scale { color:var(--scale); background:color-mix(in srgb,var(--scale) 12%,transparent); border-color:color-mix(in srgb,var(--scale) 32%,transparent); }
.v-Keep { color:var(--keep); background:color-mix(in srgb,var(--keep) 13%,transparent); border-color:color-mix(in srgb,var(--keep) 32%,transparent); }
.v-Cut { color:var(--cut); background:color-mix(in srgb,var(--cut) 12%,transparent); border-color:color-mix(in srgb,var(--cut) 32%,transparent); }
.v-Early { color:var(--early); background:color-mix(in srgb,var(--early) 12%,transparent); border-color:color-mix(in srgb,var(--early) 32%,transparent); }
.st { display:none; }
.up { color:var(--scale); } .down { color:var(--cut); }
.barcell { position:relative; min-width:140px; }
.barcell .b { height:8px; border-radius:4px; opacity:.85; }
svg text { fill:var(--faint); font-size:11px; font-family:'Space Grotesk',sans-serif; }
.tip { position:fixed; pointer-events:none; background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:10px; font-size:12px; max-width:320px; display:none; z-index:10; box-shadow:var(--shadow); }
.empty { color:var(--muted); padding:24px; text-align:center; }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:6px; }
.legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:0; }
.ptabs { display:inline-flex; gap:3px; margin-left:10px; padding:3px; background:var(--panel); border:1px solid var(--line); border-radius:80px; vertical-align:middle; }
.ptabs a { padding:4px 14px; border-radius:80px; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-decoration:none; }
.ptabs a:hover { color:var(--ink); }
.ptabs a.on { color:#fff; background:linear-gradient(110deg,var(--accent),var(--accent2)); }
@media (max-width:900px) { .wrap { padding:0 16px; } header { padding-top:20px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <span class="eyebrow"><span class="d"></span><span id="eyebrow">Meta</span></span><span class="ptabs" id="ptabs" style="display:none"></span>
    <h1>Creative <span class="grad">analysis</span></h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="actions">
    <select id="clientSel" title="Switch client" style="display:none"></select>
    <button id="theme" title="Switch light / dark">◐ Theme</button>
    <button id="csv">Download CSV</button>
    <button id="refresh" class="primary">Refresh from Meta</button>
  </div>
</header>
<div id="banners"></div>
<main id="app" style="display:none">
  <div class="bar">
    <label>Dates <select id="range">
      <option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30" selected>Last 30 days</option>
      <option value="60">Last 60 days</option><option value="90">Last 90 days</option><option value="custom">Custom…</option></select></label>
    <span id="customDates" style="display:none"><input type="date" id="since"> – <input type="date" id="until"></span>
    <label id="acctWrap" style="display:none">Account <select id="acct"><option value="">All accounts</option></select></label>
    <label>Campaign <select id="campaign"><option value="">All campaigns</option></select></label>
    <label>Ads <select id="kind"><option value="">All formats</option></select>
      <select id="partner"><option value="">Partnership + brand</option><option value="1">Partnership ads</option><option value="0">Brand ads</option></select></label>
    <label>Judge by <select id="group">
      <option value="ad">Each ad</option><option value="name">Ad name (same creative across ad sets)</option></select></label>
    <span class="badge" title="Totals and the average ROAS count everything active campaigns spent in the range, ads paused since included, as Ads Manager does. Only ads running now (ad, ad set and campaign on) are judged.">Active campaigns · running ads judged</span>
  </div>
  <div class="bar rules">
    <span><b>Scale</b> when ROAS ≥ <input type="number" id="scaleX" step="0.05" value="1.2">× average and ≥ <input type="number" id="minPurch" step="1" value="2"> <span id="purchWord">purchases</span></span>
    <span><b>Keep</b> when ROAS ≥ <input type="number" id="keepX" step="0.05" value="0.8">× average</span>
    <span><b>Cut</b> below that</span>
    <span><b>Too early</b> until spend ≥ <input type="number" id="minSpend" step="5"> <span id="minSpendNote"></span></span>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs">
    <button data-tab="creatives" class="on">Creatives: scale / keep / cut</button>
    <button data-tab="hooks">Hooks</button>
    <button data-tab="formats">Formats &amp; angles</button>
  </div>
  <section id="tab-creatives"></section>
  <section id="tab-hooks" style="display:none"></section>
  <section id="tab-formats" style="display:none"></section>
</main>
</div>
<div class="tip" id="tip"></div>
<script>
const $ = s => document.querySelector(s);
// which client and platform this page is for: /caba is CABA Design, / and /soteri are Soteri Skin, /soteri/google its Google Ads
const PARTS = location.pathname.toLowerCase().split("/").filter(Boolean);
const PLATFORM = PARTS.includes("google") ? "google" : "meta";
const CLIENT = PARTS.find(p => p !== "google" && p !== "meta" && p !== "index.html") || "soteri";
const G = PLATFORM === "google", PNAME = G ? "Google" : "Meta";
const Q = `client=${encodeURIComponent(CLIENT)}&platform=${PLATFORM}`;
// the words that differ between the platforms
const L = G ? {purch:"Conv.", purchases:"conversions", Purchases:"Conversions", value:"Conv. value", hook:"View rate", hookT:"Video views ÷ impressions",
               v3:"Video views", v3T:"YouTube video views", hold:"Watched to end", holdT:"Share of views watched to the end", cp3:"Cost / view",
               ctrT:"Clicks ÷ impressions", adset:"ad group", adsets:"ad groups", tool:"Google Ads", running:"ad, ad group and campaign on",
               opening:"First headline", search:"Search name, campaign, headline…"}
            : {purch:"Purch.", purchases:"purchases", Purchases:"Purchases", value:"Purchase value", hook:"Hook rate", hookT:"3-second video plays ÷ impressions (videos only)",
               v3:"3-sec views", v3T:"Video plays of at least 3 seconds", hold:"Hold rate", holdT:"ThruPlays ÷ 3-second plays: how many keep watching", cp3:"Cost / 3-sec view",
               ctrT:"Link clicks ÷ impressions", adset:"ad set", adsets:"ad sets", tool:"Ads Manager", running:"ad, ad set and campaign on",
               opening:"Opening line", search:"Search name, campaign, hook…"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D = null, money, money0, moneyK;
const S = { tab:"creatives", verdict:"all", q:"", sort:{creatives:["spend",-1], hooks:["hook",-1], copy:["spend",-1], formats:["spend",-1], seg:["spend",-1]},
            segDelim:"_", segPos:0, minSpendTouched:false };
const VERDICTS = ["Scale","Keep","Cut","Early"];
const VLABEL = {Scale:"Scale", Keep:"Keep running", Cut:"Cut", Early:"Too early"};
const VCOLOR = v => getComputedStyle(document.documentElement).getPropertyValue({Scale:"--scale",Keep:"--keep",Cut:"--cut",Early:"--early"}[v]).trim();

// ── data ──────────────────────────────────────────────────────────────────
async function load() {
  const r = await fetch("/api/data?" + Q); const d = await r.json();
  if (d.platform && d.platform !== PLATFORM) { location.replace("/" + (d.slug || CLIENT)); return; }   // a client without Google: its Meta page
  if (d.client) $("#eyebrow").textContent = `${PNAME} · ${d.client}`;
  platformTabs(d);
  if (d.loading && d.error && !d.started) {                 // never read (Google not connected yet): say so, don't pretend to load
    $("#meta").textContent = `Nothing has been read from ${PNAME} yet for ${d.client || "this client"}.`;
    banners(d); return;
  }
  if (d.loading) {
    const mins = d.started ? Math.max(0, Math.round((Date.now() - new Date(d.started)) / 60000)) : null;
    $("#meta").innerHTML = d.waiting ? `Waiting for another read to finish, then ${esc(d.client || "this client")} is read from ${PNAME}. This page reloads by itself.`
      : `Reading ${esc(d.client || "this client")}'s ads from ${PNAME}${mins != null ? ` (started ${mins} min ago)` : ""}: the last 90 days of results, then what each ad shows. This page reloads by itself.`
        + (d.progress ? `<br><span style="color:var(--faint)">Now: ${esc(d.progress)}</span>` : "");
    banners(d); setTimeout(load, 8000); return;
  }
  D = d;
  const cur = D.account.currency || "USD";
  money = new Intl.NumberFormat(undefined, {style:"currency", currency:cur, maximumFractionDigits:2});
  money0 = new Intl.NumberFormat(undefined, {style:"currency", currency:cur, maximumFractionDigits:0});
  moneyK = new Intl.NumberFormat(undefined, {style:"currency", currency:cur, notation:"compact", maximumSignificantDigits:3});
  D.accounts = D.accounts && D.accounts.length ? D.accounts : [D.account];
  document.title = `${D.client || D.account.name} · Creative Analysis`;
  $("#eyebrow").textContent = `${PNAME} · ${D.client || D.account.name}`;
  document.title = `${D.client || D.account.name} · ${PNAME} Creative Analysis`;
  $("#partner").style.display = G ? "none" : "";
  if (D.clients && D.clients.length > 1) {
    $("#clientSel").innerHTML = D.clients.map(c => `<option value="${esc(c.slug)}"${c.slug === D.slug ? " selected" : ""}>${esc(c.name)}</option>`).join("");
    $("#clientSel").style.display = "";
  }
  const acctNames = D.accounts.length > 1 ? `${D.accounts.length} ad accounts (${D.accounts.map(a => a.name).join(", ")})` : D.account.name;
  $("#acctWrap").style.display = D.accounts.length > 1 ? "" : "none";
  $("#acct").innerHTML = `<option value="">All ${D.accounts.length} accounts</option>` + D.accounts.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("");
  $("#meta").innerHTML = `${esc(acctNames)} · ${ACTIVE().length} active ${G ? "ads and asset groups" : "ads"} (${L.running}) · data for the last ${D.rows.length ? daysBetween(D.since, D.until)+1 : 0} days · refreshed ${D.builtAt ? new Date(D.builtAt).toLocaleString() : "—"} (${D.refreshHours >= 24 && D.refreshHours % 24 === 0 ? (D.refreshHours === 24 ? "daily" : "every " + D.refreshHours/24 + " days") : "every " + D.refreshHours + "h"})`;
  banners(D);
  fillCampaigns();
  const kinds = [...new Set(D.ads.filter(campaignActive).map(kindOf))].sort((a, b) => KIND_ORDER(a) - KIND_ORDER(b) || a.localeCompare(b));
  $("#kind").innerHTML = `<option value="">All formats</option>` + kinds.map(k => `<option value="${esc(k)}">${esc(KIND_LABEL[k] || k)}</option>`).join("");
  $("#until").value = D.until; $("#since").value = shift(D.until, -29);
  $("#since").min = $("#until").min = D.since; $("#since").max = $("#until").max = D.until;
  // pick the most common name delimiter for the angle breakdown
  const counts = {"_":0, "|":0, "-":0, " - ":0};
  ACTIVE().forEach(a => Object.keys(counts).forEach(k => counts[k] += a.name.split(k).length - 1));
  S.segDelim = Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
  $("#app").style.display = "";
  render();
}
// the campaigns of the chosen account (all of them for "All accounts"), keeping the chosen one when it is still there
function fillCampaigns() {
  const acct = $("#acct").value, cur = $("#campaign").value;
  const camps = [...new Set(D.ads.filter(a => campaignActive(a) && (!acct || a.account === acct)).map(a => a.campaign).filter(Boolean))].sort();
  $("#campaign").innerHTML = `<option value="">All campaigns</option>` + camps.map(c => `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join("");
}
// the Meta / Google switch, for a client that has both
function platformTabs(d) {
  const ps = d.platforms || ["meta"], slug = d.slug || CLIENT;
  $("#ptabs").style.display = ps.length > 1 ? "" : "none";
  $("#ptabs").innerHTML = ps.map(p => `<a href="/${esc(slug)}${p === "meta" ? "" : "/" + p}" class="${p === PLATFORM ? "on" : ""}">${p === "google" ? "Google" : "Meta"}</a>`).join("");
}
function banners(d) {
  let h = "";
  if (d.demo) h += `<div class="banner demo">Demo data: these numbers are made up. Set ${G ? "the GOOGLE_ADS_* sign-in" : "META_ADS_ACCESS_TOKEN"} on the server (and remove DEMO) to see ${esc(d.client || "the client")}'s real ads.</div>`;
  if (d.warning) h += `<div class="banner demo">${esc(d.warning)}</div>`;
  if (d.error) h += `<div class="banner err">${d.started || d.rows ? `The last refresh from ${PNAME} failed: ` : ""}${esc(d.error)}${d.rows ? " Showing the last good data." : ""}</div>`;
  $("#banners").innerHTML = h;
}
// a campaign is on when Meta says so; data read before campaign statuses were stored falls back to "has a running ad"
function campaignActive(a) {
  if (a.campaign_status) return a.campaign_status === "ACTIVE";
  if (!D._liveCamps) D._liveCamps = new Set(D.ads.filter(x => x.status === "ACTIVE").map(x => x.campaign));
  return D._liveCamps.has(a.campaign);
}
// broad format for the Ads filter: single and flexible images together, single and flexible videos together
const kindOf = a => G ? (a.format || "Other") : /video/i.test(a.format || "") ? "Video" : /image/i.test(a.format || "") ? "Image" : (a.format || "Other");
const KIND_LABEL = G ? {} : {Image:"Image ads (single + flexible)", Video:"Video ads (single + flexible)"};
const KIND_ORDER = k => G ? 0 : ({Image:0, Video:1}[k] ?? 2);
function adFilter() {
  const k = $("#kind").value, p = G ? "" : $("#partner").value;
  if (!k && !p) return null;
  return a => (!k || kindOf(a) === k) && (!p || (p === "1" ? a.partnership === true : a.partnership === false));
}
function adFilterLabel() {
  const k = $("#kind").value, p = G ? "" : $("#partner").value;
  return [p === "1" ? "partnership" : p === "0" ? "brand" : "", k ? k.toLowerCase() : ""].filter(Boolean).join(" ") + " ads";
}
const daysBetween =(a,b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const shift = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };

function range() {
  const v = $("#range").value;
  if (v === "custom") return [$("#since").value || D.since, $("#until").value || D.until];
  return [shift(D.until, -(+v - 1)), D.until];
}

function blank() { return {spend:0, impr:0, clicks:0, purch:0, rev:0, atc:0, v3:0, thru:0, ads:[]}; }
function add(t, r) { t.spend += r[2]; t.impr += r[3]; t.clicks += r[4]; t.purch += r[5]; t.rev += r[6]; t.atc += r[7]; t.v3 += r[8]; t.thru += r[9]; }
function finish(t) {
  t.roas = t.spend ? t.rev / t.spend : 0; t.cpa = t.purch ? t.spend / t.purch : null;
  t.ctr = t.impr ? t.clicks / t.impr : 0; t.cvr = t.clicks ? t.purch / t.clicks : 0;
  t.hook = t.v3 && t.impr ? t.v3 / t.impr : null; t.hold = t.v3 ? t.thru / t.v3 : null; t.cp3 = t.v3 ? t.spend / t.v3 : null;
  return t;
}

// per-ad totals for the chosen dates and filters, the account total, and the rules
function compute() {
  // Totals and the benchmark: everything active campaigns spent in the range, paused ads included (what Ads Manager shows
  // for those campaigns). Creatives judged: only ads Meta calls ACTIVE (the ad, its ad set and its campaign all on).
  const [since, until] = range(), camp = $("#campaign").value, acct = $("#acct").value;
  // The Ads filter (format, partnership) narrows the totals and the creatives, but the benchmark stays the average of all
  // ads in the chosen campaigns, so a filtered creative is still judged against the account, not against its own kind.
  const keep = adFilter();
  const perAd = new Map(), total = blank(), paused = blank(), all = blank();
  for (const r of D.rows) {
    if (r[0] < since || r[0] > until) continue;
    const ad = D.ads[r[1]];
    if (acct && ad.account !== acct) continue;
    if (camp && ad.campaign !== camp) continue;
    if (!campaignActive(ad)) continue;
    add(all, r);
    if (keep && !keep(ad)) continue;
    add(total, r);
    if (ad.status !== "ACTIVE") { add(paused, r); continue; }
    let t = perAd.get(r[1]); if (!t) { t = blank(); t.ad = ad; t.ads = [ad]; perAd.set(r[1], t); }
    add(t, r);
  }
  finish(total); finish(all); total.paused = paused; total.all = all; total.filtered = !!keep;
  const avg = all.roas;
  const acctCpa = all.purch ? all.spend / all.purch : 0;
  const autoMin = acctCpa ? Math.round(acctCpa * 1.5) : 75;   // 1.5 × the account's CPA before an ad is judged
  if (!S.minSpendTouched) $("#minSpend").value = autoMin;
  $("#minSpendNote").textContent = S.minSpendTouched ? `(1.5 × account CPA is ${cost(autoMin)})` : `(1.5 × the ${cost(acctCpa)} account CPA)`;
  const rules = { avg, scaleX:+$("#scaleX").value || 1.2, keepX:+$("#keepX").value || 0.8, minPurch:+$("#minPurch").value || 0, minSpend:+$("#minSpend").value || 0 };
  return { since, until, perAd:[...perAd.values()].map(finish), total, rules };
}

function judge(t, R) {
  const ratio = R.avg ? t.roas / R.avg : 0;
  t.ratio = ratio;
  if (t.spend < R.minSpend) { t.verdict = "Early"; t.why = `${money0.format(t.spend)} spent, needs ${money0.format(R.minSpend)} before judging`; }
  else if (ratio >= R.scaleX && t.purch >= R.minPurch) { t.verdict = "Scale"; t.why = `ROAS ${t.roas.toFixed(2)} is ${ratio.toFixed(2)}× the average`; }
  else if (ratio >= R.keepX) { t.verdict = "Keep"; t.why = ratio >= R.scaleX ? `ROAS high but only ${cnt(t.purch)} ${t.purch==1 ? L.purchases.replace(/s$/, "") : L.purchases}` : `ROAS ${t.roas.toFixed(2)} is near the average`; }
  else { t.verdict = "Cut"; t.why = t.purch ? `ROAS ${t.roas.toFixed(2)} is ${(100 - ratio*100).toFixed(0)}% below the average` : `${money0.format(t.spend)} spent, no ${L.purchases}`; }
  return t;
}

function groupBy(list, keyFn, labelFn) {
  const m = new Map();
  for (const t of list) {
    const k = keyFn(t); if (k == null) continue;
    let g = m.get(k); if (!g) { g = blank(); g.key = k; g.label = labelFn ? labelFn(t) : k; g.ads = []; m.set(k, g); }
    ["spend","impr","clicks","purch","rev","atc","v3","thru"].forEach(f => g[f] += t[f]);
    g.ads.push(...t.ads);
  }
  return [...m.values()].map(finish);
}

// creatives: each ad, or ads sharing a name merged into one row
function creatives(C) {
  let list = C.perAd;
  if ($("#group").value === "name") {
    list = groupBy(list, t => t.ad.name.trim().toLowerCase(), t => t.ad.name);
    list.forEach(g => g.ad = g.ads.find(a => a.status === "ACTIVE") || g.ads[0]);
  }
  list.forEach(t => judge(t, C.rules));
  return list;
}

// ── formatting ────────────────────────────────────────────────────────────
const num = x => x == null || !x ? "—" : Math.round(x).toLocaleString();
const cnt = x => Math.round(x || 0).toLocaleString();                                   // a count that may be 0
const big = x => Math.abs(x) >= 1e5 ? moneyK.format(x) : Math.abs(x) >= 1000 || !x ? money0.format(x) : money.format(x);   // $2.17M, $48,210, $512.40
const cost = x => x == null ? "—" : Math.abs(x) >= 100 ? money0.format(x) : money.format(x);                       // a cost per something: cents only while they matter
const partLabel = a => a.partnership === true ? "Partnership ad" : a.partnership === false ? "Brand ad" : "Not known";
const pct = (x, d=1) => x == null ? "—" : (x*100).toFixed(d) + "%";
const rx = x => x ? x.toFixed(2) + "×" : "—";
const vsAvg = (t, avg) => { if (!avg || !t.spend) return "—"; const d = t.roas/avg - 1; return `<span class="${d>=0?"up":"down"}">${d>=0?"+":""}${(d*100).toFixed(0)}%</span>`; };
const pill = v => `<span class="pill v-${v}">${VLABEL[v]}</span>`;
const thumb = a => a.thumb ? `<img class="thumb" loading="lazy" src="${esc(a.thumb)}" alt="">` : `<div class="thumb">${esc(a.format || "")}</div>`;
const amLink = a => { const act = (a.account || D.account.id || "").replace(/\D/g, ""); return act ? `https://adsmanager.facebook.com/adsmanager/manage/ads?act=${act}&selected_ad_ids=${a.id}` : ""; };
function links(a) {
  const out = [];
  if (G) {
    if (a.post_url) out.push(`<a href="${esc(a.post_url)}" target="_blank" rel="noopener">Video</a>`);
    if (a.landing) out.push(`<a href="${esc(a.landing)}" target="_blank" rel="noopener">Landing page</a>`);
    return out.join(" · ");
  }
  if (!D.demo && amLink(a)) out.push(`<a href="${amLink(a)}" target="_blank" rel="noopener">Ads Manager</a>`);
  if (a.post_url) out.push(`<a href="${esc(a.post_url)}" target="_blank" rel="noopener">Post</a>`);
  return out.join(" · ");
}

function table(id, cols, rows, key) {
  const [sk, dir] = S.sort[key];
  const col = cols.find(c => c.k === sk) || cols[0];
  const val = r => col.v ? col.v(r) : r[col.k];
  rows = rows.slice().sort((a, b) => { const x = val(a), y = val(b); return (x == null) - (y == null) || (x < y ? -1 : x > y ? 1 : 0) * dir; });
  if (!rows.length) return `<div class="empty">Nothing in this view.</div>`;
  return `<div class="tablewrap"><table id="${id}" data-key="${key}"><thead><tr>${cols.map(c =>
    `<th data-k="${c.k}" class="${c.num?"num":""} ${c.k===sk?"sorted"+(dir>0?" asc":""):""}" ${c.title?`title="${esc(c.title)}"`:""}>${c.h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.num?"num":""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

// ── scatter (spend × ROAS, or hook rate × ROAS) ───────────────────────────
function scatter(points, o) {
  const W = 820, H = 300, L = 46, Rm = 14, T = 12, B = 34;
  if (!points.length) return `<div class="empty">Nothing to plot.</div>`;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const xlog = o.xlog;
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (xlog) { x0 = Math.max(x0, 1); x1 = Math.max(x1, x0 * 10); }
  if (x0 === x1) x1 = x0 + 1;
  const ymax = Math.max(...ys, o.lines.reduce((m, l) => Math.max(m, l.y), 0)) * 1.08 || 1;
  const fx = x => L + (W - L - Rm) * (xlog ? (Math.log(Math.max(x,x0)) - Math.log(x0)) / (Math.log(x1) - Math.log(x0)) : (x - x0) / (x1 - x0));
  const fy = y => T + (H - T - B) * (1 - Math.min(y, ymax) / ymax);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label)}">`;
  for (let i = 0; i <= 4; i++) { const y = ymax * i / 4; s += `<line x1="${L}" x2="${W-Rm}" y1="${fy(y)}" y2="${fy(y)}" stroke="var(--line)"/><text x="${L-6}" y="${fy(y)+4}" text-anchor="end">${o.yfmt(y)}</text>`; }
  const ticks = xlog ? [] : [0,1,2,3,4].map(i => x0 + (x1-x0)*i/4);
  if (xlog) for (let p = Math.pow(10, Math.floor(Math.log10(x0))); p <= x1 * 1.01; p *= 10) [1,3].forEach(m => { const v = p*m; if (v >= x0 && v <= x1) ticks.push(v); });
  ticks.forEach(v => s += `<text x="${fx(v)}" y="${H-B+16}" text-anchor="middle">${o.xfmt(v)}</text>`);
  s += `<text x="${(W+L)/2}" y="${H-2}" text-anchor="middle">${esc(o.xlabel)}</text>`;
  if (o.vline != null) s += `<line x1="${fx(o.vline)}" x2="${fx(o.vline)}" y1="${T}" y2="${H-B}" stroke="var(--avg)" stroke-dasharray="4 4"/>`;
  o.lines.forEach((l, i) => s += `<line x1="${L}" x2="${W-Rm}" y1="${fy(l.y)}" y2="${fy(l.y)}" stroke="${l.c}" stroke-dasharray="${l.dash||"4 4"}" stroke-width="${l.w||1}"/><text x="${W-Rm-i*150}" y="${fy(l.y)-4}" text-anchor="end" style="fill:${l.c}">${esc(l.t)}</text>`);
  points.forEach((p, i) => s += `<circle cx="${fx(p.x)}" cy="${fy(p.y)}" r="${p.r||5}" fill="${p.c}" fill-opacity=".8" stroke="var(--bg)" data-tip="${esc(p.tip)}"/>`);
  return s + `</svg>`;
}

// ── tabs ──────────────────────────────────────────────────────────────────
function render() {
  if (!D) return;
  const C = compute(), list = creatives(C), R = C.rules, T = C.total;
  // KPIs
  const by = v => list.filter(t => t.verdict === v);
  const sum = (a, f) => a.reduce((s, t) => s + t[f], 0);
  const kv = (cls, l, v, s, full) => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v"${full ? ` title="${esc(full)}"` : ""}>${v}</div><div class="s">${s||""}</div></div>`;
  const vk = v => { const a = by(v), sp = sum(a, "spend"); return kv(v.toLowerCase(), VLABEL[v], cnt(a.length), `${big(sp)} · ${T.spend ? (sp/T.spend*100).toFixed(0) : 0}% of spend`); };
  const P = T.paused;
  const A = T.all, F = T.filtered, fl = F ? adFilterLabel() : "";
  $("#kpis").innerHTML = kv("", F ? `Spend · ${esc(fl)}` : "Spend · active campaigns", big(T.spend),
      `${C.since} → ${C.until}${F && A.spend ? ` · ${(T.spend/A.spend*100).toFixed(0)}% of all spend` : ""}${P.spend >= 1 ? `<br>incl. ${big(P.spend)} from ads paused since` : ""}`, money.format(T.spend))
    + kv("", L.value, big(T.rev), `${cnt(T.purch)} ${L.purchases}${P.purch ? ` (${cnt(P.purch)} from paused ads)` : ""}`, money.format(T.rev))
    + (F ? kv("", `ROAS · ${esc(fl)}`, T.spend ? T.roas.toFixed(2) : "—", `CPA ${cost(T.cpa)}`) : "")
    + kv("avg", F ? "Average ROAS · all ads (benchmark)" : "Average ROAS (benchmark)", A.spend ? A.roas.toFixed(2) : "—", `CPA ${cost(A.cpa)}`)
    + VERDICTS.map(vk).join("");
  renderCreatives(C, list); renderHooks(C, list); renderFormats(C, list);
}

function renderCreatives(C, list) {
  const R = C.rules;
  const counts = Object.fromEntries(VERDICTS.map(v => [v, list.filter(t => t.verdict === v).length]));
  let rows = list.filter(t => S.verdict === "all" || t.verdict === S.verdict);
  if (S.q) { const q = S.q.toLowerCase(); rows = rows.filter(t => (t.ad.name + " " + t.ad.campaign + " " + t.ad.adset + " " + t.ad.hook).toLowerCase().includes(q)); }
  const pts = list.filter(t => t.spend > 0).map(t => ({x:t.spend, y:t.roas, c:VCOLOR(t.verdict), r: 4 + Math.min(6, Math.sqrt(t.purch)),
    tip:`${t.ad.name} — ${VLABEL[t.verdict]}\nSpend ${money0.format(t.spend)} · ROAS ${t.roas.toFixed(2)} · ${cnt(t.purch)} ${L.purchases}`}));
  const multi = $("#group").value === "name";
  const cols = [
    {k:"thumb", h:"", f:t => thumb(t.ad), v:t => 0},
    {k:"name", h:"Creative", v:t => t.ad.name.toLowerCase(), f:t => `<div class="name">${esc(t.ad.name)}<span class="st ${t.ad.status}">${esc((t.ad.status||"").replace(/_/g," ").toLowerCase())}</span></div>
      <div class="small">${esc(t.ad.format)}${t.ad.partnership ? ` · <span style="color:var(--avg)">Partnership${t.ad.partnership_ids ? " (" + esc(t.ad.partnership_ids) + ")" : ""}</span>` : ""}${t.ad.cta ? " · " + esc(t.ad.cta) : ""} · ${D.accounts.length > 1 && !$("#acct").value ? esc((D.accounts.find(x => x.id === t.ad.account) || {}).name || "") + " · " : ""}${esc(t.ad.campaign)}${multi && t.ads.length > 1 ? ` · in ${t.ads.length} ${L.adsets}` : ` · ${esc(t.ad.adset)}`}</div>${G && t.ad.hook ? `<div class="small hook">“${esc(t.ad.hook)}”</div>` : ""}<div class="small">${links(t.ad)}</div>`},
    {k:"verdict", h:"Verdict", v:t => VERDICTS.indexOf(t.verdict), f:t => `${pill(t.verdict)}<div class="small" style="max-width:220px">${esc(t.why)}</div>`},
    {k:"spend", h:"Spend", num:1, f:t => money0.format(t.spend)},
    {k:"rev", h:L.value, num:1, f:t => money0.format(t.rev)},
    {k:"roas", h:"ROAS", num:1, f:t => t.roas.toFixed(2)},
    {k:"ratio", h:"vs avg", num:1, f:t => vsAvg(t, R.avg)},
    {k:"purch", h:L.purch, num:1, f:t => cnt(t.purch)},
    {k:"cpa", h:"CPA", num:1, f:t => cost(t.cpa)},
    {k:"ctr", h:"CTR", num:1, title:L.ctrT, f:t => pct(t.ctr, 2)},
    {k:"hook", h:L.hook, num:1, title:L.hookT, f:t => pct(t.hook)},
    {k:"v3", h:L.v3, num:1, title:L.v3T, f:t => num(t.v3)},
  ];
  $("#tab-creatives").innerHTML = `
    <div class="card"><h2>Spend vs ROAS</h2><p class="sub">Every ${G ? "ad and Performance Max asset group" : "creative"} with spend in the range. Above the green line: scale. Below the red line: cut. Bigger dots have more ${L.purchases}.</p>
      ${scatter(pts, {xlog:true, label:"Spend vs ROAS", xlabel:"Spend (log scale)", xfmt:v => money0.format(v), yfmt:v => v.toFixed(1),
        lines:[{y:R.avg*R.scaleX, c:"var(--scale)", t:`Scale ≥ ${(R.avg*R.scaleX).toFixed(2)}`}, {y:R.avg, c:"var(--avg)", t:`Average ${R.avg.toFixed(2)}`, dash:"", w:1.5},
               {y:R.avg*R.keepX, c:"var(--cut)", t:`Cut < ${(R.avg*R.keepX).toFixed(2)}`}], vline:R.minSpend})}
      <div class="legend">${VERDICTS.map(v => `<span><i style="background:${VCOLOR(v)}"></i>${VLABEL[v]}</span>`).join("")}<span>Dashed vertical line: spend needed before judging</span></div></div>
    <div class="card">
      <div class="chips">
        <button class="chip ${S.verdict==="all"?"on":""}" data-v="all">All ${list.length}</button>
        ${VERDICTS.map(v => `<button class="chip ${S.verdict===v?"on":""}" data-v="${v}">${VLABEL[v]} ${counts[v]}</button>`).join("")}
        <input type="search" id="q" placeholder="${L.search}" value="${esc(S.q)}" style="margin-left:auto;min-width:220px">
      </div>
      ${table("t-cre", cols, rows, "creatives")}
    </div>`;
}

function renderHooks(C, list) {
  const R = C.rules;
  const vids = list.filter(t => t.hook != null && t.impr >= 1000);
  const tot = vids.reduce((a, t) => (a.v3 += t.v3, a.impr += t.impr, a.thru += t.thru, a), {v3:0, impr:0, thru:0});
  const avgHook = tot.impr ? tot.v3 / tot.impr : 0, avgHold = tot.v3 ? tot.thru / tot.v3 : 0;
  const quad = t => (t.hook >= avgHook ? "Strong hook" : "Weak hook") + ", " + (t.roas >= R.avg * R.keepX ? "converts" : "doesn't convert");
  const advice = {"Strong hook, converts":"Winner: scale and make variations of this opening",
                  "Strong hook, doesn't convert":"Stops the scroll, loses them after: fix the body, offer or landing page",
                  "Weak hook, converts":"Sells once watched: test new first 3 seconds",
                  "Weak hook, doesn't convert":"Neither works: cut"};
  const pts = vids.map(t => ({x:t.hook, y:t.roas, c:VCOLOR(t.verdict), r:4 + Math.min(6, Math.sqrt(t.purch)),
    tip:`${t.ad.name}\n${L.hook} ${pct(t.hook)} · ${L.hold} ${pct(t.hold)} · ROAS ${t.roas.toFixed(2)}\n${quad(t)}`}));
  const vcols = [
    {k:"thumb", h:"", f:t => thumb(t.ad), v:() => 0},
    {k:"name", h:"Video", v:t => t.ad.name.toLowerCase(), f:t => `<div class="name">${esc(t.ad.name)}</div><div class="small hook">${esc(t.ad.hook ? "“" + t.ad.hook + "”" : "")}</div>`},
    {k:"hook", h:L.hook, num:1, title:L.hookT, f:t => `<span class="${t.hook>=avgHook?"up":"down"}">${pct(t.hook)}</span>`},
    {k:"hold", h:L.hold, num:1, title:L.holdT, f:t => `<span class="${t.hold>=avgHold?"up":"down"}">${pct(t.hold)}</span>`},
    {k:"v3", h:L.v3, num:1, f:t => num(t.v3)},
    {k:"cp3", h:L.cp3, num:1, f:t => t.cp3 ? money.format(t.cp3) : "—"},
    {k:"ctr", h:"CTR", num:1, f:t => pct(t.ctr, 2)},
    {k:"roas", h:"ROAS", num:1, f:t => t.roas.toFixed(2)},
    {k:"spend", h:"Spend", num:1, f:t => money0.format(t.spend)},
    {k:"q", h:"Read", v:t => quad(t), f:t => `<b>${quad(t)}</b><div class="small" style="max-width:240px">${advice[quad(t)]}</div>`},
    {k:"verdict", h:"Verdict", v:t => VERDICTS.indexOf(t.verdict), f:t => pill(t.verdict)},
  ];
  // copy hooks: ads grouped by the opening line of their primary text
  const copy = groupBy(C.perAd.filter(t => t.ad.hook), t => t.ad.hook.toLowerCase(), t => t.ad.hook);
  copy.forEach(g => { judge(g, R); g.formats = [...new Set(g.ads.map(a => a.format))].join(", "); });
  const ccols = [
    {k:"label", h:G ? "First headline" : "Opening line of the primary text", v:g => g.label.toLowerCase(), f:g => `<div class="hook">“${esc(g.label)}”</div><div class="small">${g.ads.length} ad${g.ads.length>1?"s":""} · ${esc(g.formats)}</div>`},
    {k:"spend", h:"Spend", num:1, f:g => money0.format(g.spend)},
    {k:"roas", h:"ROAS", num:1, f:g => g.roas.toFixed(2)},
    {k:"ratio", h:"vs avg", num:1, f:g => vsAvg(g, R.avg)},
    {k:"purch", h:L.purch, num:1, f:g => cnt(g.purch)},
    {k:"ctr", h:"CTR", num:1, f:g => pct(g.ctr, 2)},
    {k:"hook", h:L.hook, num:1, f:g => pct(g.hook)},
    {k:"verdict", h:"Verdict", v:g => VERDICTS.indexOf(g.verdict), f:g => pill(g.verdict)},
  ];
  $("#tab-hooks").innerHTML = `
    <div class="card"><h2>${G ? "YouTube and Demand Gen videos: do people watch, and does it sell?" : "Video hooks: does the first 3 seconds stop the scroll, and does it sell?"}</h2>
      <p class="sub">Videos with at least 1,000 impressions: <b>${num(tot.v3)}</b> ${G ? "video views" : "3-second views"} at <b>${tot.v3 ? money.format(vids.reduce((s, t) => s + t.spend, 0) / tot.v3) : "—"}</b> each. Average ${L.hook.toLowerCase()} <b>${pct(avgHook)}</b> (vertical line), average ${L.hold.toLowerCase()} <b>${pct(avgHold)}</b>, average ROAS <b>${R.avg.toFixed(2)}</b>. "Converts" means ROAS above the Cut line (${(R.avg*R.keepX).toFixed(2)}).${G ? " Performance Max doesn't report video views, so its asset groups aren't here." : ""}</p>
      ${scatter(pts, {xlog:false, label:`${L.hook} vs ROAS`, xlabel:`${L.hook} (${L.hookT.toLowerCase()})`, xfmt:v => pct(v, 0), yfmt:v => v.toFixed(1),
        lines:[{y:R.avg*R.keepX, c:"var(--cut)", t:`Cut < ${(R.avg*R.keepX).toFixed(2)}`}, {y:R.avg, c:"var(--avg)", t:`Average ROAS ${R.avg.toFixed(2)}`, dash:"", w:1.5}], vline:avgHook})}
      ${table("t-vid", vcols, vids, "hooks")}</div>
    <div class="card"><h2>${G ? "Headlines: which first headline makes money" : "Copy hooks: which opening lines make money"}</h2>
      <p class="sub">${G ? "Ads and asset groups grouped by the headline that shows first (the one pinned to position 1, else the first written), judged with the same rules. Google mixes headlines in its own order, so this is a lead, not proof."
        : `Ads grouped by the first line of their primary text (what shows before "See more"), judged with the same rules.`}</p>
      ${table("t-copy", ccols, copy, "copy")}</div>`;
}

function renderFormats(C, list) {
  const R = C.rules, T = C.total;
  // one table per way of slicing the creatives: spend, return against the average, the funnel, video attention, verdict mix
  function breakdown(id, label, keyOf) {
    const gs = groupBy(C.perAd, t => keyOf(t.ad)).filter(g => g.spend >= 1);
    gs.forEach(g => { judge(g, R); g.n = g.ads.length; g.verdicts = VERDICTS.map(v => [v, list.filter(t => t.ads.some(a => keyOf(a) === g.key) && t.verdict === v).length]); });
    const maxR = Math.max(...gs.map(g => g.roas), R.avg) || 1;
    const cols = [
      {k:"key", h:label, f:g => `<b>${esc(g.key)}</b><div class="small">${g.n} ad${g.n>1?"s":""}</div>`},
      {k:"spend", h:"Spend", num:1, f:g => `${money0.format(g.spend)}<div class="small">${T.spend ? (g.spend/T.spend*100).toFixed(0) : 0}% of total</div>`},
      {k:"roas", h:"ROAS", f:g => `<div class="barcell"><div style="display:flex;justify-content:space-between"><b>${g.roas.toFixed(2)}</b>${vsAvg(g, R.avg)}</div>
         <div style="position:relative"><div class="b" style="width:${g.roas/maxR*100}%;background:${VCOLOR(g.verdict)}"></div>
         <div style="position:absolute;top:-3px;left:${R.avg/maxR*100}%;width:2px;height:14px;background:var(--avg)" title="Average ROAS"></div></div></div>`},
      {k:"cpa", h:"CPA", num:1, f:g => cost(g.cpa)},
      {k:"ctr", h:"CTR", num:1, f:g => pct(g.ctr, 2)},
      {k:"cvr", h:"Conv. rate", num:1, title:G ? "Conversions ÷ clicks" : "Purchases ÷ link clicks", f:g => pct(g.cvr, 2)},
      {k:"v3", h:L.v3, num:1, f:g => num(g.v3)},
      {k:"hook", h:L.hook, num:1, f:g => pct(g.hook)},
      {k:"mix", h:"Creatives by verdict", v:g => g.verdicts[0][1], f:g => g.verdicts.filter(x => x[1]).map(([v, n]) => `<span class="pill v-${v}" style="margin:1px">${n} ${VLABEL[v].toLowerCase()}</span>`).join(" ")},
    ];
    if (!S.sort[id]) S.sort[id] = ["spend", -1];
    return table("t-" + id, cols, gs, id);
  }
  const unknownPartner = C.perAd.filter(t => t.ad.partnership == null).length;
  const ugcNotPartner = C.perAd.filter(t => /(^|[^a-z])ugc([^a-z]|$)/i.test(t.ad.name) && t.ad.partnership === false);
  // ad-name segments (angles, hooks, creators… whatever the naming convention puts in each position)
  const maxSeg = Math.max(1, ...ACTIVE().map(a => a.name.split(S.segDelim).length));
  // tagged names ("…_C:UGC_X:BeforeAfter_…") are compared by tag; otherwise by position
  const tagCount = {};
  ACTIVE().forEach(a => Object.keys(tagsOf(a.name)).forEach(k => tagCount[k] = (tagCount[k] || 0) + 1));
  const tagKeys = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]);
  if (S.segBy == null) {   // the concept tag when most of the range's spend carries tags, else part #3 of the older names (Ad575_Video_UGC-Creator_…)
    const tagged = C.perAd.filter(t => tagsOf(t.ad.name).C).reduce((s, t) => s + t.spend, 0);
    S.segBy = tagKeys.includes("C") && tagged >= C.total.spend / 2 ? "tag:C" : maxSeg > 2 ? "pos:2" : "pos:0";
  }
  if (S.segBy.startsWith("pos:") && +S.segBy.slice(4) >= maxSeg) S.segBy = "pos:0";
  const byTag = S.segBy.startsWith("tag:"), tag = S.segBy.slice(4), pos = +S.segBy.slice(4);
  const partOf = a => { if (byTag) return tagsOf(a.name)[tag] || null; const p = a.name.split(S.segDelim); return p.length > pos ? p[pos].trim() || null : null; };
  const segOf = t => partOf(t.ad);
  const examples = [...new Set(ACTIVE().map(partOf).filter(Boolean))].slice(0, 4).join(", ");
  const untagged = C.perAd.filter(t => !segOf(t));
  const seg = groupBy(C.perAd, segOf).filter(g => g.spend >= 1);
  seg.forEach(g => { judge(g, R); g.n = g.ads.length; });
  const scols = [
    {k:"key", h:"Name part", f:g => `<b>${esc(g.key)}</b><div class="small">${g.n} ad${g.n>1?"s":""}</div>`},
    {k:"spend", h:"Spend", num:1, f:g => money0.format(g.spend)},
    {k:"roas", h:"ROAS", num:1, f:g => g.roas.toFixed(2)},
    {k:"ratio", h:"vs avg", num:1, f:g => vsAvg(g, R.avg)},
    {k:"purch", h:L.purch, num:1, f:g => cnt(g.purch)},
    {k:"ctr", h:"CTR", num:1, f:g => pct(g.ctr, 2)},
    {k:"hook", h:L.hook, num:1, f:g => pct(g.hook)},
    {k:"verdict", h:"Verdict", v:g => VERDICTS.indexOf(g.verdict), f:g => pill(g.verdict)},
  ];
  const delims = [["_","underscore _"],["|","pipe |"],[" - ","spaced dash  - "],["-","dash -"]];
  $("#tab-formats").innerHTML = `
    <div class="card"><h2>Ad formats</h2><p class="sub">Spend and return by format. The purple tick is the average ROAS (${R.avg.toFixed(2)}).</p>
      ${breakdown("formats", "Format", a => a.format || "Other")}</div>
    ${G ? "" : `<div class="card"><h2>Partnership ads vs brand ads</h2>
      <p class="sub">Partnership ads run from the brand together with a creator's Facebook or Instagram identity (Meta's branded-content setting on the creative).
        ${ugcNotPartner.length ? `<b style="color:var(--early)">${ugcNotPartner.length} running ad${ugcNotPartner.length>1?"s":""} named UGC ${ugcNotPartner.length>1?"are":"is"} not set up as a partnership ad.</b>` : ""}
        ${unknownPartner ? `Meta didn't return the partnership setting for ${unknownPartner} ad${unknownPartner>1?"s":""} (shown as "Not known").` : ""}</p>
      ${breakdown("partner", "Ad type", partLabel)}</div>
    <div class="card"><h2>Call-to-action buttons</h2><p class="sub">Which button the ad shows. Flexible ads with several buttons are counted under the first one.</p>
      ${breakdown("cta", "Button", a => a.cta || "Not known")}</div>`}
    <div class="card"><h2>Angles, hooks and creators from ad names</h2>
      <p class="sub">Compare ads by a tag in their name (<code>C:UGC</code>, <code>X:Before-After</code>…), or by the part in a fixed position for names without tags.</p>
      <div class="chips"><label class="small">Compare by <select id="segBy">
          ${tagKeys.length ? `<optgroup label="Name tags">${tagKeys.map(k => `<option value="tag:${esc(k)}" ${S.segBy==="tag:"+k?"selected":""}>${esc(k)}: ${esc(TAGS[k] || "tag")} (${tagCount[k]} ads)</option>`).join("")}</optgroup>` : ""}
          <optgroup label="Part of the name by position">${Array.from({length:maxSeg}, (_, i) => `<option value="pos:${i}" ${S.segBy==="pos:"+i?"selected":""}>Part #${i+1}</option>`).join("")}</optgroup></select></label>
        ${byTag ? "" : `<label class="small">split on <select id="segDelim">${delims.map(([d,l]) => `<option value="${esc(d)}" ${d===S.segDelim?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`}
        <span class="small">e.g. ${esc(examples)}</span>
        ${untagged.length ? `<span class="small">· ${untagged.length} ad${untagged.length>1?"s":""} with spend have no ${byTag ? esc(tag) + ": tag" : "part #" + (pos+1)} and are left out (${money0.format(untagged.reduce((s,t)=>s+t.spend,0))})</span>` : ""}</div>
      ${table("t-seg", scols, seg, "seg")}</div>`;
}

const ACTIVE = () => D.ads.filter(a => a.status === "ACTIVE");
// tags in Soteri's ad names, "Ad537_F:Static_SKU:LongTerm_T:Branded_X:IClearedMyEczema…" → {F:"Static", SKU:"LongTerm", …}
const tagsOf = name => { const o = {}; for (const m of String(name).matchAll(/(?:^|_)([A-Za-z]{1,4}):([^_]+)/g)) o[m[1]] = m[2]; return o; };
const TAGS = {F:"format", SKU:"product", T:"ad type", C:"concept", X:"hook / message", H:"landing page", E:"creator", V:"visual",
              I:"iteration / style", PT:"video length", P:"version"};

// ── CSV of the creatives view ─────────────────────────────────────────────
function csv() {
  const C = compute(), list = creatives(C);
  const head = ["Ad account","Ad name","Ad ID","Status","Format","Campaign",G ? "Ad group" : "Ad set",L.opening,"Verdict","Why","Spend",L.value,"ROAS","ROAS vs avg",L.Purchases,"CPA","CTR",L.hook,L.hold,L.v3,L.cp3,"Partnership ad","CTA button"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(",")].concat(list.sort((a,b) => b.spend - a.spend).map(t => [(D.accounts.find(x => x.id === t.ad.account) || {}).name || "", t.ad.name, t.ads.map(a => a.id).join(" "), t.ad.status, t.ad.format, t.ad.campaign,
    t.ad.adset, t.ad.hook, VLABEL[t.verdict], t.why, t.spend.toFixed(2), t.rev.toFixed(2), t.roas.toFixed(2), (t.ratio||0).toFixed(2), Math.round(t.purch),
    t.cpa ? t.cpa.toFixed(2) : "", (t.ctr*100).toFixed(2)+"%", t.hook != null ? (t.hook*100).toFixed(1)+"%" : "", t.hold != null ? (t.hold*100).toFixed(1)+"%" : "", Math.round(t.v3), t.cp3 ? t.cp3.toFixed(3) : "", partLabel(t.ad), t.ad.cta || ""].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], {type:"text/csv"}));
  a.download = `${D.slug || "client"}-${PLATFORM}-creatives_${C.since}_${C.until}.csv`; a.click();
}

// ── events ────────────────────────────────────────────────────────────────
$("#acct").addEventListener("change", fillCampaigns);
["#range","#acct","#campaign","#kind","#partner","#group","#since","#until","#scaleX","#keepX","#minPurch"].forEach(s => $(s).addEventListener("change", () => {
  $("#customDates").style.display = $("#range").value === "custom" ? "" : "none"; render(); }));
// custom dates come from the calendar only: a click opens it, typing is ignored, and "from" can't pass "to"
["#since", "#until"].forEach(s => {
  const el = $(s);
  el.addEventListener("click", () => { try { el.showPicker(); } catch (e) {} });
  el.addEventListener("keydown", e => { if (e.key !== "Tab") e.preventDefault(); });
  el.addEventListener("change", () => { $("#until").min = $("#since").value || D.since; $("#since").max = $("#until").value || D.until; });
});
$("#range").addEventListener("change", () => { if ($("#range").value === "custom") setTimeout(() => { try { $("#since").showPicker(); } catch (e) {} }, 0); });
$("#minSpend").addEventListener("change", () => { S.minSpendTouched = true; render(); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["creatives","hooks","formats"].forEach(t => $("#tab-" + t).style.display = t === S.tab ? "" : "none"); });
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-v]"); if (chip) { S.verdict = chip.dataset.v; render(); return; }
  const th = e.target.closest("th[data-k]"); if (th) { const key = th.closest("table").dataset.key, k = th.dataset.k;
    S.sort[key] = [k, S.sort[key][0] === k ? -S.sort[key][1] : -1]; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "segDelim") { S.segDelim = e.target.value; S.segBy = "pos:0"; render(); }
  if (e.target.id === "segBy") { S.segBy = e.target.value; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); } });
const tip = $("#tip");
document.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.style.display = "block"; tip.style.whiteSpace = "pre-line"; tip.textContent = t.dataset.tip;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 330) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
$("#csv").addEventListener("click", csv);
$("#clientSel").addEventListener("change", e => { const c = (D.clients || []).find(x => x.slug === e.target.value);
  location.href = "/" + e.target.value + (G && c && (c.platforms || []).includes("google") ? "/google" : ""); });
$("#refresh").textContent = `Refresh from ${PNAME}`;
$("#purchWord").textContent = L.purchases;
$("#theme").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {}
  render();
});
$("#refresh").addEventListener("click", async () => {
  const b = $("#refresh"); b.disabled = true; b.textContent = "Refreshing…";
  const r = await (await fetch("/api/refresh?" + Q, {method:"POST"})).json().catch(() => ({}));
  if (r.error) { b.disabled = false; b.textContent = `Refresh from ${PNAME}`; alert(r.error); return; }
  setTimeout(async () => { await load(); b.disabled = false; b.textContent = `Refresh from ${PNAME}`; }, 20000);
});
load();
</script>
</body>
</html>
